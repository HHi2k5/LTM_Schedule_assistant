spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    origins: ${CORS_ORIGINS}
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
