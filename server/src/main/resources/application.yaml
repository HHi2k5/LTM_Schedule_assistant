server:
  port: 8080

spring:
  application:
    name: backend-service
  profiles:
    active: dev
  flyway:
    enabled: ${DB_MIGRATIONS_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 32MB

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    root: INFO
    web: INFO

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:}
    lifetime-seconds: 28800
