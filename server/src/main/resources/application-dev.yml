spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: false
  datasource:
    url: jdbc:mysql://localhost:3306/teacher_schedule_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: password
  jpa:
    show-sql: true
